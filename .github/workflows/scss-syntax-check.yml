name: SCSS syntax check

on:
  pull_request:
    paths:
      - 'css/**/*.scss'
      - '_includes/styles.html'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/scss-syntax-check.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'css/**/*.scss'
      - '_includes/styles.html'
      - '_config.yml'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/scss-syntax-check.yml'

jobs:
  check-scss:
    name: Build site and validate SCSS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Validate SCSS via Jekyll build
        run: bundle exec jekyll build --trace
